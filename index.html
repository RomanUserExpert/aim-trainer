<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aim Trainer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="hp"></span><span id="ht"></span><span id="hs"></span><span id="ha"></span><span id="hraw" class="err" hidden>NO RAW INPUT</span></div>
<div id="xh"></div>
<div id="hm"><i style="--a:45deg"></i><i style="--a:135deg"></i><i style="--a:225deg"></i><i style="--a:315deg"></i></div>

<div class="menu on" id="menu"><div class="shell">
  <header class="top">
    <div class="logo">AIM<span>trainer</span></div>
    <nav class="seg" id="tabs"><button data-t="game">Play</button><button data-t="set">Settings</button></nav>
    <button class="btn g" id="fs"></button>
  </header>

  <section id="p-game">
    <div class="bar">
      <nav class="seg sm" id="subs"><button data-s="sc">Scenarios</button><button data-s="pr">Presets</button></nav>
      <label class="inline">Target size <b></b><input id="size" type="range" min="1" max="10" step="1"></label>
    </div>
    <div id="s-sc" class="cols">
      <div class="k-click"><h2><i></i>Clicking</h2><div id="l-click"></div></div>
      <div class="k-track"><h2><i></i>Tracking</h2><div id="l-track"></div></div>
      <div class="k-switch"><h2><i></i>Switching</h2><div id="l-switch"></div></div>
    </div>
    <div id="s-pr" class="presets"></div>
  </section>

  <section id="p-set" class="cards">
    <div class="card">
      <h2>Mouse &amp; display</h2>
      <div class="set">
        <label>Sensitivity from<select id="game"></select></label>
        <label><span id="sensT">Sensitivity</span><input id="sens" type="number" step="0.001" min="0"></label>
        <label id="dpiL">Mouse DPI<input id="dpi" type="number" step="50" min="50"></label>
        <label>FOV (horizontal)<input id="fov" type="number" step="0.01" min="50" max="150"></label>
        <label>Aspect ratio<select id="ar"><option value="0">Native</option><option value="1.7778">16:9</option><option value="1.6">16:10</option><option value="1.3333">4:3</option></select></label>
      </div>
      <div class="info" id="info"></div>
      <div class="info" id="raw"></div>
    </div>
    <div class="card">
      <h2>Sound &amp; colors</h2>
      <div class="set">
        <label>Clicking hit volume: <b></b><input id="vClick" type="range" min="0" max="100"></label>
        <label>Tracking / switching hit volume: <b></b><input id="vTrack" type="range" min="0" max="100"></label>
        <label>Miss click volume: <b></b><input id="vMiss" type="range" min="0" max="100"></label>
        <label>Target color<input id="tCol" type="color"></label>
        <label>World color<input id="wCol" type="color"></label>
        <label>Grid opacity: <b></b><input id="grid" type="range" min="0" max="100"></label>
      </div>
    </div>
    <div class="card">
      <h2>Crosshair</h2>
      <div class="xp" id="xhp"><div class="xc" id="xhpc"></div></div>
      <div class="set">
        <label>Type<select id="xType"><option value="dot">Dot</option><option value="cross">Cross</option></select></label>
        <label>Color<input id="xCol" type="color"></label>
        <label>Outline<select id="xOut"><option value="0">None</option><option value="1">Full</option><option value="0.5">Half (2 edges)</option></select></label>
        <label class="xo">Outline opacity: <b></b><input id="xOutA" type="range" min="0" max="100"></label>
        <label class="xd">Dot size: <b></b><input id="xDot" type="range" min="1" max="16"></label>
        <label class="xx">Length: <b></b><input id="xLen" type="range" min="1" max="30"></label>
        <label class="xx">Thickness: <b></b><input id="xThk" type="range" min="1" max="8"></label>
        <label class="xx">Gap: <b></b><input id="xGap" type="range" min="0" max="20"></label>
      </div>
    </div>
  </section>

  <div class="hint">Every scenario lasts 60 s. In tracking and switching, hold LMB on the target. Esc pauses, F toggles fullscreen. FOV: Valorant 103, CS2 at 16:9 ≈ 106.26.</div>
</div></div>

<div class="ov" id="pause"><div class="box">
  <h1>Paused</h1>
  <div class="row"><button class="btn" id="resume">Resume</button><button class="btn g" id="restart1">Restart</button><button class="btn g" id="tomenu1">Menu</button></div>
  <div class="info err" id="perr"></div>
</div></div>

<div class="ov" id="res"><div class="box">
  <div class="sub" id="rp"></div>
  <h1 id="rn" style="margin:0"></h1>
  <div class="big" id="rs"></div>
  <div class="nb" id="rb"></div>
  <div class="st" id="rl"></div>
  <div class="row"><button class="btn" id="rNext"></button><button class="btn g" id="rMenu"></button></div>
</div></div>

<div class="ov" id="sum"><div class="box wide">
  <div class="sub">Total score</div>
  <h1 id="sn" style="margin:0"></h1>
  <div class="big" id="sTot"></div>
  <div class="st t3" id="sl"></div>
  <div class="row"><button class="btn" id="sAgain">Again (Enter)</button><button class="btn g" id="sMenu">Menu (Esc)</button></div>
</div></div>

<script src="engine.js"></script>
<script src="scenarios.js"></script>
<script src="ui.js"></script>
</body>
</html>
